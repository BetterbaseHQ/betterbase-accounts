name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    env:
      SQLX_OFFLINE: "true"
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      # RustEmbed compiles crates/api/assets into the binary — the dir is
      # gitignored, so build the web UI first (mirrors local `just build-web`)
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm build
        working-directory: web
      - run: cp -r web/dist crates/api/assets
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Storage tests provision a throwaway schema per test via DATABASE_URL;
      # BB_TEST_REQUIRE_DB makes an unreachable database fail instead of skip.
      - run: cargo install cargo-llvm-cov --version 0.9.1 --locked
      - name: Test Rust with coverage and enforce thresholds
        run: bash scripts/coverage-rust.sh
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
      - name: Summarize Rust coverage
        if: ${{ !cancelled() && hashFiles('target/coverage/rust/summary.json') != '' }}
        run: python3 scripts/coverage-summary.py rust target/coverage/rust/summary.json >> "$GITHUB_STEP_SUMMARY"
      - name: Detect security mutations
        run: python3 scripts/test-security-mutations.py
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && hashFiles('target/security-mutations/reports/summary.json') != '' }}
        with:
          name: rust-security-mutations
          path: target/security-mutations/reports/
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && hashFiles('target/coverage/rust/summary.json') != '' }}
        with:
          name: rust-coverage
          path: target/coverage/rust/
          retention-days: 30
          if-no-files-found: error

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --check .
      - run: pnpm exec tsc -b
      - run: pnpm test:coverage
      - name: Summarize web coverage
        if: ${{ !cancelled() && hashFiles('web/coverage/coverage-summary.json') != '' }}
        run: python3 ../scripts/coverage-summary.py web coverage/coverage-summary.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && hashFiles('web/coverage/coverage-summary.json') != '' }}
        with:
          name: web-coverage
          path: web/coverage/
          retention-days: 30
          if-no-files-found: error
